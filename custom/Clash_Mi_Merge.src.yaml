# 3. 虚拟网卡网段对齐 (匹配 Fake-IP 范围)
tun:
  enable: true
  stack: system
  inet4-address:
    - 172.19.0.1/30
  dns-hijack:
    - "any:53"
  strict-route: false
  auto-detect-interface: true
  disable-icmp-forwarding: false
  auto-route: true
  mtu: 1420

# 4. 流量嗅探（三台路由与客户端统一参数与 skip-domain 并集）
sniffer:
  enable: true
  override-destination: true
  force-dns-mapping: true
  parse-pure-ip: true
  skip-domain:
    - 'Mijia Cloud'
    - 'dlg.io.mi.com'
    - '+.push.apple.com'
    - '+.apple.com'
    - '+.apple-pay.com'
    - '+.applepay.com'
    - '+.applewallet.com'
    - '+.unionpay.com'
    - '+.95516.com'
    - '+.oray.com'
    - '+.sunlogin.net'
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    QUIC:
      ports: [443]
