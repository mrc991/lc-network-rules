# 1. 客户端与连接存活优化（各端统一关闭 IPv6，避免运营商 IPv6 DNS 旁路）
ipv6: false
# 进程规则（AnyDesk / Synology Drive）要能命中，不能是 off
find-process-mode: always
external-ui-url: ""
global-client-fingerprint: chrome
keep-alive-idle: 30
keep-alive-interval: 30

# 2. 核心 DNS 策略（对齐 MT6000 稳定版架构：Fake-IP + respect-rules + 国内 UDP / 海外 DoH）
dns:
  enable: true
  prefer-h3: false
  ipv6: false
  ipv6-timeout: 300
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  cache-algorithm: arc
  default-nameserver:
    - 114.114.114.114
    - 119.29.29.29
    - 223.5.5.5
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback: []
  respect-rules: true
  nameserver-policy:
    'geosite:cn':
      - 223.5.5.5
      - 119.29.29.29
    'geosite:geolocation-!cn':
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

