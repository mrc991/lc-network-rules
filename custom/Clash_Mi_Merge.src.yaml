# Clash Mi 统一覆写 —— 源文件（手改这里）
# 产物：overwrite/Clash_Mi_Merge.yaml（Clash Mi 订阅的远程地址 https://raw.githubusercontent.com/mrc991/lc-network-rules/main/overwrite/Clash_Mi_Merge.yaml）
#       由 scripts/build_clashmi_yaml.py 生成：本文件内容 + 完整 rules（prepend-rules 在最前，后接同一模板展开的订阅规则）
#       overwrite/Clash_Mi_Merge.js（备用 JS 覆写）由 scripts/build_clashmi_js.py 生成
# 配套订阅模板：clash/Custom_Clash.ini（GEOIP,cn 必须带 no-resolve）
# 本文件不得出现顶层 rules:（由生成脚本写入）

# 0. 强制 QUIC 回退 TCP；直连与高优先级自定义规则（广告拦截板块已移除）
# Clash Mi 的 YAML 覆写不认识 prepend-rules，所以生成脚本把它们并入完整 rules；产物里不保留 prepend-rules 键。
# find-process-mode 会被 Clash Mi「核心设置 → 进程匹配模式」再覆盖，每台机器需在 App 里设为 always。
prepend-rules:
  - "AND,((NETWORK,udp),(DST-PORT,443)),REJECT"
  # Synology Drive / QuickConnect / 家 NAS：强制直连（避免 Fake-IP / 代理打断 QC）
  - "PROCESS-NAME,cloud-drive-daemon,DIRECT"
  - "PROCESS-NAME,cloud-drive-connect,DIRECT"
  - "PROCESS-NAME,cloud-drive-ui,DIRECT"
  - "PROCESS-NAME,cloud-drive-eventd,DIRECT"
  - "PROCESS-NAME,SynologyDrive,DIRECT"
  - "PROCESS-NAME,SynologyDriveClient,DIRECT"
  - "DOMAIN-SUFFIX,quickconnect.to,DIRECT"
  - "DOMAIN-SUFFIX,quickconnect.cn,DIRECT"
  - "DOMAIN-SUFFIX,synology.com,DIRECT"
  - "DOMAIN-SUFFIX,synology.cn,DIRECT"
  - "DOMAIN-SUFFIX,synology.me,DIRECT"
  - "DOMAIN,BigRichNAS,DIRECT"
  - "DOMAIN-SUFFIX,BigRichNAS.local,DIRECT"
  - "IP-CIDR,192.168.8.8/32,DIRECT,no-resolve"
  # AnyDesk：进程直连覆盖裸 IP 打洞；域名直连覆盖中继。
  - "PROCESS-NAME,AnyDesk,DIRECT"
  - "PROCESS-NAME,AnyDesk.exe,DIRECT"
  - "DOMAIN-SUFFIX,anydesk.com,DIRECT"
  - "DOMAIN-SUFFIX,net.anydesk.com,DIRECT"
  - "DOMAIN-SUFFIX,anydesk.com.cn,DIRECT"
  - "DOMAIN-SUFFIX,net.anydesk.com.cn,DIRECT"
  # HomeBistro & Cloudflare Tunnel：直连
  - "DOMAIN,homebistro.bigrich.cc,DIRECT"
  - "DOMAIN-SUFFIX,argotunnel.com,DIRECT"
  - "IP-CIDR,198.41.192.0/24,DIRECT,no-resolve"
  - "IP-CIDR,198.41.200.0/24,DIRECT,no-resolve"
  # c.ha.zdz.plus：直连（不走代理）
  - "DOMAIN,c.ha.zdz.plus,DIRECT"
  # 黄果短剧资源（切片与解密密钥域名被 SNI 阻断，须强制走代理）
  - "DOMAIN-SUFFIX,drleao.cn,🚀 手动选择"
  - "DOMAIN-SUFFIX,hzjvlo.cn,🚀 手动选择"
  # AWS WAF（Crypto 交易所人机校验，走 Crypto 代理分组）
  - "DOMAIN-SUFFIX,awswaf.com,📈 Crypto"
  # Apple Pay / 钱包 / 银联：强制直连（防 Fake-IP 劫持与海外节点触发银行/银联风控）
  - "DOMAIN-SUFFIX,apple-pay.com,DIRECT"
  - "DOMAIN-SUFFIX,applepay.com,DIRECT"
  - "DOMAIN-SUFFIX,applepaycash.cn,DIRECT"
  - "DOMAIN-SUFFIX,applepaysupplies.cn,DIRECT"
  - "DOMAIN-SUFFIX,applewallet.com,DIRECT"
  - "DOMAIN-SUFFIX,smp-device.apple.com,DIRECT"
  - "DOMAIN-SUFFIX,smp-device-content.apple.com,DIRECT"
  - "DOMAIN-SUFFIX,smp-payment.apple.com,DIRECT"
  - "DOMAIN-SUFFIX,apple-pay-gateway.apple.com,DIRECT"
  - "DOMAIN-SUFFIX,pass.id.apple.com,DIRECT"
  - "DOMAIN-SUFFIX,wallet.apple.com,DIRECT"
  - "DOMAIN-SUFFIX,api.apple-pay.com,DIRECT"
  - "DOMAIN-SUFFIX,c-apple-pay.apple.com,DIRECT"
  - "DOMAIN-SUFFIX,smoot.apple.com,DIRECT"
  - "DOMAIN-KEYWORD,apple-pay,DIRECT"
  - "DOMAIN-SUFFIX,unionpay.com,DIRECT"
  - "DOMAIN-SUFFIX,unionpay.cn,DIRECT"
  - "DOMAIN-SUFFIX,unionpaysecure.com,DIRECT"
  - "DOMAIN-SUFFIX,unionpayintl.com,DIRECT"
  - "DOMAIN-SUFFIX,unionpayintl.cn,DIRECT"
  - "DOMAIN-SUFFIX,95516.com,DIRECT"
  - "DOMAIN-SUFFIX,95516.cn,DIRECT"
  - "DOMAIN-SUFFIX,95516.net,DIRECT"
  - "DOMAIN-SUFFIX,chinaums.com,DIRECT"
  - "DOMAIN-SUFFIX,chinapay.com,DIRECT"
  - "DOMAIN-SUFFIX,chinapay.cn,DIRECT"
  - "DOMAIN-SUFFIX,chinaunionpay.com,DIRECT"
  - "DOMAIN-SUFFIX,chinaunionpay.com.cn,DIRECT"
