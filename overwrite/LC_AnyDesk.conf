[YAML]
# Name: LC AnyDesk
# Author: mrc991
# Project: mrc991/lc-network-rules
# Description: OpenClash 上 AnyDesk 仅按域名直连（含中国区），不依赖进程匹配
# Compatibility: 需 OpenClash 支持 [YAML] 覆写块；DIRECT 为内置出站
# Action: 将四条 DOMAIN-SUFFIX 规则插入现有 rules 顶部
# Fake-IP: 本模块不改 dns.fake-ip-filter（避免覆盖整表）。请在路由
#   /etc/openclash/custom/openclash_custom_fake_filter.list 加入：
#   +.anydesk.com / +.net.anydesk.com / +.anydesk.com.cn / +.net.anydesk.com.cn
#   （或见 overwrite/openclash_fake_filter_anydesk.snippet）
# Verification: 运行配置含 DOMAIN-SUFFIX,anydesk* ,DIRECT；解析 boot.net.anydesk.com 非 198.18

+rules:
  - DOMAIN-SUFFIX,anydesk.com,DIRECT
  - DOMAIN-SUFFIX,net.anydesk.com,DIRECT
  - DOMAIN-SUFFIX,anydesk.com.cn,DIRECT
  - DOMAIN-SUFFIX,net.anydesk.com.cn,DIRECT
