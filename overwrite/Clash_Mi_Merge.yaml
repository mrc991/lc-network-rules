tun:
  enable: true
  stack: system
  inet4-address:
  - 172.19.0.1/30
  dns-hijack:
  - any:53
  strict-route: false
  auto-detect-interface: true
  disable-icmp-forwarding: false
  auto-route: true
  mtu: 1420
sniffer:
  enable: true
  override-destination: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    QUIC:
      ports:
      - 443
