# Clash Mi 统一覆写（Mac / Windows / 手机共用）
# 远程地址：https://raw.githubusercontent.com/mrc991/lc-network-rules/main/overwrite/Clash_Mi_Merge.yaml
# 配套订阅模板：clash/Custom_Clash.ini（GEOIP,cn 必须带 no-resolve）

# 0. 强制 QUIC 回退 TCP；广告拦截（与 Shadowrocket 同源 Johnshall 列表）
# 广告规则以 rule-provider 加载，不展开进订阅；直接 REJECT，不依赖订阅里的任何分组
# 误拦时：删掉下面两条 RULE-SET 或在该行前加 # 即可关闭
prepend-rules:
  - "AND,((NETWORK,udp),(DST-PORT,443)),REJECT"
  # Synology Drive / QuickConnect / 家 NAS：强制直连（避免 Fake-IP / 代理打断 QC）
  - "PROCESS-NAME,cloud-drive-daemon,DIRECT"
  - "PROCESS-NAME,cloud-drive-connect,DIRECT"
  - "PROCESS-NAME,cloud-drive-ui,DIRECT"
  - "PROCESS-NAME,cloud-drive-eventd,DIRECT"
  - "PROCESS-NAME,SynologyDrive,DIRECT"
  - "PROCESS-NAME,SynologyDriveClient,DIRECT"
  - "DOMAIN-SUFFIX,quickconnect.to,DIRECT"
  - "DOMAIN-SUFFIX,quickconnect.cn,DIRECT"
  - "DOMAIN-SUFFIX,synology.com,DIRECT"
  - "DOMAIN-SUFFIX,synology.cn,DIRECT"
  - "DOMAIN-SUFFIX,synology.me,DIRECT"
  - "DOMAIN,BigRichNAS,DIRECT"
  - "DOMAIN-SUFFIX,BigRichNAS.local,DIRECT"
  - "IP-CIDR,192.168.8.8/32,DIRECT,no-resolve"
  # AnyDesk：进程直连覆盖裸 IP 打洞；域名直连覆盖中继。家用路由不读本文件，要另改 fake-ip 名单。
  - "PROCESS-NAME,AnyDesk,DIRECT"
  - "PROCESS-NAME,AnyDesk.exe,DIRECT"
  - "DOMAIN-SUFFIX,anydesk.com,DIRECT"
  - "DOMAIN-SUFFIX,net.anydesk.com,DIRECT"
  - "DOMAIN-SUFFIX,anydesk.com.cn,DIRECT"
  - "DOMAIN-SUFFIX,net.anydesk.com.cn,DIRECT"
  - "RULE-SET,lc-adblock-domain,REJECT"
  - "RULE-SET,lc-adblock-ip,REJECT,no-resolve"

rule-providers:
  lc-adblock-domain:
    type: http
    behavior: domain
    format: yaml
    url: https://testingcf.jsdelivr.net/gh/mrc991/lc-network-rules@main/overwrite/adblock/AdBlock_Domain.yaml
    path: ./ruleset/lc_adblock_domain.yaml
    interval: 86400
  lc-adblock-ip:
    type: http
    behavior: ipcidr
    format: yaml
    url: https://testingcf.jsdelivr.net/gh/mrc991/lc-network-rules@main/overwrite/adblock/AdBlock_IP.yaml
    path: ./ruleset/lc_adblock_ip.yaml
    interval: 86400

# 1. 客户端与连接存活优化（各端统一关闭 IPv6，避免运营商 IPv6 DNS 旁路）
ipv6: false
# 进程规则（AnyDesk / Synology Drive）要能命中，不能是 off
find-process-mode: always
external-ui-url: ""
global-client-fingerprint: chrome
keep-alive-idle: 30
keep-alive-interval: 30

# 2. 核心 DNS 劫持与解析优化 (redir-host -> fake-ip)
dns:
  enable: true
  prefer-h3: false
  ipv6: false
  ipv6-timeout: 300
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  cache-algorithm: arc
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
  # 不设 fallback：未命中规则的域名不在本地解析，交给节点远端解析（就近 CDN）
  fallback: []
  respect-rules: false
  # 覆盖订阅自带的 geolocation-!cn -> 1.1.1.1 直连 DoH（与节点远端解析冲突）
  # 本地只解析 fake-ip-filter 与直连域名，一律用国内 DoH
  nameserver-policy:
    'geosite:cn':
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
    'geosite:geolocation-!cn':
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
  # 节点域名解析（防启动死锁）
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

# 假 IP 黑名单：强制以下域名进行真实 IP 解析（包含你的内网穿透与 NAS 域名）
