# 3. 虚拟网卡网段对齐 (匹配 Fake-IP 范围)
tun:
  enable: true
  stack: system
  inet4-address:
    - 172.19.0.1/30
  dns-hijack:
    - "any:53"
  strict-route: false       # 放行系统直连与局域网流量，避免断网与握手卡死
  auto-detect-interface: true
  disable-icmp-forwarding: false
  auto-route: true # 配合界面里的 ICMP 转发与基础接管
  mtu: 1420


# 4. 开启流量嗅探 (解决某些软件不发起 DNS 请求导致无法分流的问题)
sniffer:
  enable: true
  override-destination: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    QUIC:
      ports: [443]