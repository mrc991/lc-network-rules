# Clash Mi 统一覆写（YAML，Mac / Windows 的 Clash Mi 订阅此地址）——自动生成，请勿手改
# 源文件：custom/Clash_Mi_Merge.src.yaml；生成：scripts/build_clashmi_yaml.py（CI 每天重建）
# rules = 源文件 prepend-rules + 同一模板 clash/Custom_Clash.ini 经 subconverter 展开的完整订阅规则。
# Clash Mi 的 YAML 覆写对列表整体替换，所以这里的 rules 会替换订阅 rules，等效于把 prepend-rules 放到最前。
# 注意：find-process-mode 会被 Clash Mi「核心设置 → 进程匹配模式」再覆盖，每台机器需在 App 里设为 always。
# 订阅：1200 条，前置：24 条，合计：1224 条
rule-providers:
  lc-adblock-domain:
    type: http
    behavior: domain
    format: yaml
    url: https://testingcf.jsdelivr.net/gh/mrc991/lc-network-rules@main/overwrite/adblock/AdBlock_Domain.yaml
    path: ./ruleset/lc_adblock_domain.yaml
    interval: 86400
  lc-adblock-ip:
    type: http
    behavior: ipcidr
    format: yaml
    url: https://testingcf.jsdelivr.net/gh/mrc991/lc-network-rules@main/overwrite/adblock/AdBlock_IP.yaml
    path: ./ruleset/lc_adblock_ip.yaml
    interval: 86400
