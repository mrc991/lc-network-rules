[YAML]
# Name: LC AdBlock (Johnshall)
# Author: mrc991
# Project: mrc991/lc-network-rules
# Description: 为 OpenClash 附加与 Shadowrocket / Clash Mi 同源的 Johnshall 广告拦截列表
# Compatibility: 需 OpenClash 支持 [YAML] 覆写块；不依赖订阅中的任何策略组
# Action: 添加两个远程 Rule Provider，并将对应规则插入现有 rules 顶部
# Conflicts: 规则优先于原有规则；误拦时在 OpenClash 覆写设置中停用本模块
# Verification: 在最终运行配置中检查 lc-adblock-domain / lc-adblock-ip 与两条前置规则
#
# 说明：
# - 列表由 mrc991/lc-network-rules 每日构建（scripts/build_adblock.py），来源 Johnshall sr_top500_whitelist_ad.conf 的 Reject 段
# - 以 Rule Provider 加载，不展开进订阅，避免数万条规则逐条匹配带来的延迟
# - IP 规则带 no-resolve，不触发本地 DNS 解析（防 DNS 泄漏）

rule-providers:
  lc-adblock-domain:
    type: http
    behavior: domain
    format: yaml
    url: https://testingcf.jsdelivr.net/gh/mrc991/lc-network-rules@main/overwrite/adblock/AdBlock_Domain.yaml
    path: ./rule_provider/lc_adblock_domain.yaml
    interval: 86400

  lc-adblock-ip:
    type: http
    behavior: ipcidr
    format: yaml
    url: https://testingcf.jsdelivr.net/gh/mrc991/lc-network-rules@main/overwrite/adblock/AdBlock_IP.yaml
    path: ./rule_provider/lc_adblock_ip.yaml
    interval: 86400

+rules:
  - RULE-SET,lc-adblock-domain,REJECT
  - RULE-SET,lc-adblock-ip,REJECT,no-resolve
